# Generated by gateseal from gateseal.lock. Run gateseal configure to change it; do not edit it.
trigger:
  batch: false
  branches:
    include: ["release/2.x"]
resources:
  repositories:
    - repository: gateseal_policy
      type: git
      name: "platform/gateseal-policy"
jobs:
  - job: gateseal
    pool:
      vmImage: ubuntu-24.04
    timeoutInMinutes: 30
    uses:
      repositories:
        - gateseal_policy
    steps:
      - checkout: self
        displayName: Check out the repository with its full history
        clean: true
        fetchDepth: 0
        persistCredentials: false
      - bash: |
          set -euo pipefail
          read -r system architecture < <(uname -s -m)
          machine="$system on $architecture"
          if [ "$machine" = "Linux on x86_64" ] && ! getconf GNU_LIBC_VERSION >/dev/null 2>&1
          then
            machine="$machine without glibc"
          fi
          if [ "$machine" != "Linux on x86_64" ]; then
            echo "gateseal: the gate job needs Linux on x86-64 with glibc," \
              "and this machine is $machine." >&2
            exit 1
          fi
          umask 077
          agent_home=$HOME
          agent_config=${XDG_CONFIG_HOME:-$HOME/.config}
          agent_global=${GIT_CONFIG_GLOBAL:-}
          export HOME="$AGENT_TEMPDIRECTORY/gateseal-home"
          unset XDG_CONFIG_HOME XDG_CACHE_HOME XDG_DATA_HOME XDG_STATE_HOME
          unset GIT_CONFIG_GLOBAL GIT_TEMPLATE_DIR PRE_COMMIT_HOME SKIP
          unset UV_CACHE_DIR UV_PYTHON_CACHE_DIR UV_PYTHON_INSTALL_DIR UV_CONFIG_FILE
          unset UV_PROJECT_ENVIRONMENT PIP_CACHE_DIR VIRTUALENV_OVERRIDE_APP_DATA
          for name in ${!MISE_@}; do
            unset "$name"
          done
          export MISE_SYSTEM_DATA_DIR="$HOME/mise-system"
          mkdir -p "$HOME"
          if [ -n "$agent_global" ]; then
            git config --file "$HOME/.gitconfig" --add include.path "$agent_global"
          else
            git config --file "$HOME/.gitconfig" --add include.path "$agent_config/git/config"
            git config --file "$HOME/.gitconfig" --add include.path "$agent_home/.gitconfig"
          fi
          tools="$AGENT_TEMPDIRECTORY/gateseal-tools"
          mkdir -p "$tools"
          curl --fail --location --silent --show-error "$GATESEAL_UV_URL" \
            --output "$tools/uv.tar.gz"
          echo "$GATESEAL_UV_SHA256  $tools/uv.tar.gz" | sha256sum --check -
          tar -xzf "$tools/uv.tar.gz" -C "$tools" --strip-components=1
          curl --fail --location --silent --show-error "$GATESEAL_MISE_URL" \
            --output "$tools/mise"
          echo "$GATESEAL_MISE_SHA256  $tools/mise" | sha256sum --check -
          chmod 0755 "$tools/uv" "$tools/mise"
          export PATH="$tools:$PATH"
          echo "##vso[task.prependpath]$tools"
          command="$AGENT_TEMPDIRECTORY/gateseal-command"
          uv venv --no-config --managed-python --python "$GATESEAL_PYTHON" "$command"
          uv pip install --no-config --python "$command/bin/python" \
            "gateseal @ git+$GATESEAL_REPOSITORY@$GATESEAL_COMMIT"
          GIT_CONFIG_GLOBAL="$HOME/.gitconfig-setup" GIT_CONFIG_NOSYSTEM=1 \
            GIT_CONFIG_COUNT=0 GIT_CONFIG_PARAMETERS= \
            "$command/bin/gateseal" setup
          "$command/bin/gateseal" check
        displayName: Set up the locked gateseal, pre-commit and the policy
        env:
          GATESEAL_POLICY_TOKEN: $(GATESEAL_POLICY_TOKEN)
          GATESEAL_JOB_TOKEN: $(System.AccessToken)
          GIT_CONFIG_COUNT: "3"
          GIT_CONFIG_KEY_0: credential.useHttpPath
          GIT_CONFIG_VALUE_0: "true"
          GIT_CONFIG_KEY_1: credential.helper
          GIT_CONFIG_VALUE_1: ""
          GIT_CONFIG_KEY_2: "credential.https://dev.azure.com/team/platform/_git/gateseal-policy.helper"
          GIT_CONFIG_VALUE_2: "!f() { test \"$1\" = get || return 0; token=$GATESEAL_POLICY_TOKEN; case \"$token\" in \"\"|[$]\"(\"*) token=$GATESEAL_JOB_TOKEN ;; esac; echo username=x-access-token; echo \"password=$token\"; }; f"
          GATESEAL_UV_URL: "https://github.com/astral-sh/uv/releases/download/0.13.6/uv-x86_64-unknown-linux-gnu.tar.gz"
          GATESEAL_UV_SHA256: "f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645"
          GATESEAL_MISE_URL: "https://github.com/jdx/mise/releases/download/v2026.10.19/mise-v2026.10.19-linux-x64"
          GATESEAL_MISE_SHA256: "3162760f40b6b5f706c60641e4ef5ee7322bc6c54f72fc26a7111b337aa18d9d"
          GATESEAL_PYTHON: "3.14"
          GATESEAL_REPOSITORY: "https://github.com/karstenevers/gateseal"
          GATESEAL_COMMIT: "5ea1000000000000000000000000000000000000"
      - bash: |
          set -euo pipefail
          export HOME="$AGENT_TEMPDIRECTORY/gateseal-home"
          unset XDG_CONFIG_HOME XDG_CACHE_HOME XDG_DATA_HOME XDG_STATE_HOME
          unset GIT_CONFIG_GLOBAL GIT_TEMPLATE_DIR PRE_COMMIT_HOME SKIP
          unset UV_CACHE_DIR UV_PYTHON_CACHE_DIR UV_PYTHON_INSTALL_DIR UV_CONFIG_FILE
          unset UV_PROJECT_ENVIRONMENT PIP_CACHE_DIR VIRTUALENV_OVERRIDE_APP_DATA
          for name in ${!MISE_@}; do
            unset "$name"
          done
          export MISE_SYSTEM_DATA_DIR="$HOME/mise-system"
          gateseal="$AGENT_TEMPDIRECTORY/gateseal-command/bin/gateseal"
          case "$GATESEAL_REASON" in
            PullRequest) "$gateseal" gate --merge "$GATESEAL_HEAD" ;;
            IndividualCI|BatchedCI) "$gateseal" gate --after "$GATESEAL_HEAD" ;;
            Schedule|Manual) "$gateseal" gate ;;
            *)
              echo "gateseal: this pipeline does not handle $GATESEAL_REASON builds." >&2
              exit 2
              ;;
          esac
        displayName: Run the gateseal gate
        env:
          GATESEAL_REASON: $(Build.Reason)
          GATESEAL_HEAD: $(Build.SourceVersion)
