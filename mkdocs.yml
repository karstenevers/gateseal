site_name: gateseal
site_description: One reviewed policy for repository checks, compiled into every repository.
site_url: https://gateseal.readthedocs.io/
repo_url: https://github.com/karstenevers/gateseal
repo_name: karstenevers/gateseal
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  custom_dir: overrides
  logo: assets/mark.svg
  favicon: assets/mark.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - assets/extra.css

hooks:
  - scripts/mkdocs_hooks.py

nav:
  - Home: index.md
  - Get started:
      - Install gateseal: install.md
      - Try gateseal: demo.md
      - Configure a repository: configure-a-repository.md
      - Check TypeScript: typescript.md
      - Work in a configured repository: work-in-a-configured-repository.md
      - How gateseal works: architecture.md
      - Troubleshooting: troubleshooting.md
  - Manage checks:
      - Adjust a setup: adjust-a-setup.md
      - Check Python tests: python-tests.md
      - Check Python dependencies: python-dependencies.md
      - The CI gate: ci-gate.md
      - GitHub CI: github-ci.md
      - Azure Pipelines: azure-pipelines.md
      - Upgrade and roll back: upgrade.md
  - Team policies:
      - Adopt a team policy: adopt-a-team-policy.md
      - Author a team policy: author-a-policy.md
      - Add a tool: add-a-tool.md
  - Reference:
      - Policy format: policy-format.md
      - Manifest and Lock: policy-contract.md
      - Tool definitions: tool-definitions.md
      - Commands and results: commands-and-results.md
      - Glossary: glossary.md

markdown_extensions:
  - github-callouts
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
