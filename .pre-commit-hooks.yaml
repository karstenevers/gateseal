- id: gateseal-check
  name: Check files and tools against gateseal.lock
  description: Compare the staged Manifest, the staged owned files and each installed tool checked at commit with gateseal.lock.
  entry: gateseal-check
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-commit]
- id: gateseal-lfs-check
  name: Check that a push uploads to Git LFS
  description: Stop a push from a clone that commits Git LFS pointers and has no push hook that uploads them.
  entry: gateseal-lfs-check
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-push]
