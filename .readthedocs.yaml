version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    pre_create_environment:
      - python -m pip install uv==0.13.6
    create_environment:
      - uv venv --python 3.14.10 "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --locked --only-group docs

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true
