# CRAP scores of the changed TypeScript and JavaScript files, from the
# coverage report that Vitest or Jest wrote earlier in the same run. The
# policy's configuration sets the limit. The repository keeps
# .crap-baseline.toml, the functions that may stay over the limit, and a push
# or a ranged gate fails a change that adds or raises an entry. pre-commit
# installs the hook's tree-sitter parsers with it.
kind = "pre-commit-repository"
stages = ["push", "ci"]
scope = "files"

[source]
repository = "https://github.com/karstenevers/gateseal-hooks"
tag = "v{version}"

[configuration]
format = "toml"

# A coverage report holds no test file, and the hook stops at a file with a
# function that the report does not measure. So the hook gets no file of a
# test, tests, __tests__ or __mocks__ folder, no file named as a test, such as
# cart.test.ts or cart.spec.tsx, no configuration file of a tool, such as
# vite.config.ts, and no file that gateseal writes. The final -- ends the
# options before pre-commit appends file names.
[hooks.crap-score-typescript]
name = "CRAP score (TypeScript)"
args = ["--config", "{configuration}", "--coverage", "{coverage-final.json}", "--"]
types_or = ["ts", "tsx", "javascript", "jsx"]
exclude = '^\.gateseal/|(^|/)(tests?|__tests__|__mocks__)/|\.(test|spec|config)\.[^/]+$'
reads = ["coverage-final.json"]
output = "plain"
