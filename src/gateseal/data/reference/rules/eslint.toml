# gateseal owns this file; gateseal configure writes it from the reviewed policy.
# gateseal checks it and writes it as .gateseal/eslint.json, which the ESLint
# definition's loader reads. The rules are ESLint's recommended rules and
# typescript-eslint's recommended rules, which turn off the core rules that
# TypeScript checks itself. gateseal policy lock records them in policy.lock.
# No rule needs type information, and no rule formats code, which Prettier does.

# The files ESLint checks, as patterns from the repository root.
files = ["**/*.ts", "**/*.tsx"]

# The parser of TypeScript, which policy.toml pins in the packages of eslint.
parser = "@typescript-eslint/parser"

# The presets whose rules apply first, in this order.
presets = ["eslint/recommended", "@typescript-eslint/recommended"]

# Each plugin by the prefix that its rules' names start with.
[plugins]
"@typescript-eslint" = "@typescript-eslint/eslint-plugin"

# Each rule with its severity, off, warn or error, and then its options. A rule
# here wins over the presets.
[rules]
# Conflicts with Prettier.
no-unexpected-multiline = "off"
