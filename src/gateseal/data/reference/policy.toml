schema = 5
release = "2026.11-team-tools"
minimum_compiler = "0.2.0"

# The Node that every npm tool of this policy runs on, such as ESLint.
node = "24.22.3"

# pre-commit-hooks is the project pre-commit/pre-commit-hooks.
[capabilities.hygiene.tools.pre-commit-hooks]
hook_ids = ["trailing-whitespace", "end-of-file-fixer", "check-yaml"]
pin = "6.0.0"
reviewed = ["6.0.0", "5.0.0"]

[capabilities.hygiene.choices]
exclude = []

[capabilities.python.tools.ruff]
hook_ids = ["ruff-check", "ruff-format"]
configuration = "rules/ruff.toml"
pin = "0.17.5"
reviewed = ["0.17.5", "0.17.1"]

[capabilities.python.choices]
target_version = "py311"

# python-tests runs the tests once, under coverage.py, at a push and in the
# gate, in the repository's uv project. Its coverage report is what
# python-crap reads, so python-crap needs python-tests too.
[capabilities.python-tests.tools.coverage]
pin = "7.17.3"
reviewed = ["7.17.3", "7.17.2"]

# python-crap scores each changed function from that report. The rules set
# the limit.
[capabilities.python-crap.tools.crap]
configuration = "rules/crap.toml"
pin = "0.1.0"
reviewed = ["0.1.0"]

[capabilities.python-crap.choices]
exclude = []

# python-mutation runs pytestmut on the lines that a push or the gate's range
# changes. It runs its own tests, apart from python-tests.
[capabilities.python-mutation.tools.pytestmut]
pin = "0.1.0"
reviewed = ["0.1.0"]

# python-types is for a uv project. Pyright runs in the repository's own
# project, where uv.lock pins the packages that it resolves imports from.
[capabilities.python-types.tools.pyright]
configuration = "rules/pyright.toml"
pin = "1.1.414"
reviewed = ["1.1.414"]

# python-lock checks at each commit that uv.lock matches pyproject.toml, with
# the uv that the pin names.
[capabilities.python-lock.tools.uv-lock]
pin = "0.13.9"
reviewed = ["0.13.9"]

# python-audit runs only in the gate. It asks a vulnerability service about
# each locked package, so a new advisory can fail a run without a commit. The
# rules list the advisories to ignore.
[capabilities.python-audit.tools.uv-audit]
configuration = "rules/uv-audit.toml"
pin = "0.13.9"
reviewed = ["0.13.9"]

# python-dependencies runs deptry in the repository's uv project. It finds
# unused, missing and transitive dependencies.
[capabilities.python-dependencies.tools.deptry]
pin = "0.25.1"
reviewed = ["0.25.1"]

[capabilities.secrets.tools.betterleaks]
configuration = "rules/betterleaks.toml"
pin = "1.10.1"
reviewed = ["1.10.1", "1.9.0", "1.8.0"]

# typescript checks staged TypeScript files with ESLint, then formats them with
# Prettier, so Prettier formats what ESLint's fixes leave. Both run from npm on
# the policy's Node, outside the repository's own Node project.
[capabilities.typescript.tools.eslint]
configuration = "rules/eslint.toml"
pin = "10.15.0"
reviewed = ["10.15.0"]

# The npm packages that every reviewed ESLint installs beside itself.
# typescript-eslint 8.73.0 accepts typescript below 6.1.0.
[capabilities.typescript.tools.eslint.packages]
"@typescript-eslint/eslint-plugin" = "8.73.0"
"@typescript-eslint/parser" = "8.73.0"
typescript = "6.0.3"

[capabilities.typescript.tools.prettier]
configuration = "rules/prettier.toml"
pin = "3.10.1"
reviewed = ["3.10.1"]

[capabilities.typescript.choices]
exclude = []

# typescript-types is for an npm or a pnpm project. tsc runs in the
# repository's own project, where the lockfile pins the packages that it
# resolves imports from. The pin is the TypeScript that ESLint's packages pin.
# A Version Exception can select 7.0.2, the faster native compiler. It refuses
# the tsconfig.json options that TypeScript 7 removed, such as baseUrl. 6.0.3
# accepts them with "ignoreDeprecations": "6.0", and 5.9.3 accepts them as is.
[capabilities.typescript-types.tools.tsc]
pin = "6.0.3"
reviewed = ["6.0.3", "7.0.2", "5.9.3"]

# typescript-audit runs only in the gate, for an npm project. OSV-Scanner asks
# the OSV service about each package in package-lock.json, so a new advisory
# can fail a run without a commit. The rules list the advisories to ignore.
[capabilities.typescript-audit.tools.osv-scanner]
configuration = "rules/osv-scanner.toml"
pin = "2.7.1"
reviewed = ["2.7.1"]

# typescript-unused runs knip at a push and in the gate, in the repository's
# own npm or pnpm project. It finds unused files, exports and dependencies.
# The rules hold knip's settings, and knip reads none of the repository's.
[capabilities.typescript-unused.tools.knip]
configuration = "rules/knip.toml"
pin = "6.46.1"
reviewed = ["6.46.1"]

# typescript-vitest and typescript-jest run the tests once, with coverage, at
# a push and in the gate, in the repository's own npm or pnpm project. Select
# the one of the project's test runner. Its coverage report is what
# typescript-crap reads, so typescript-crap needs one of the two.
[capabilities.typescript-vitest.tools.vitest]
pin = "5.1.1"
reviewed = ["5.1.1"]

# The coverage providers that the project's Vitest configuration chooses from.
[capabilities.typescript-vitest.tools.vitest.packages]
"@vitest/coverage-istanbul" = "5.1.1"
"@vitest/coverage-v8" = "5.1.1"

[capabilities.typescript-jest.tools.jest]
pin = "30.5.2"
reviewed = ["30.5.2"]

# typescript-crap scores each function of the changed files from that report.
# The rules set the limit.
[capabilities.typescript-crap.tools.crap-typescript]
configuration = "rules/crap-typescript.toml"
pin = "0.1.0"
reviewed = ["0.1.0"]

[capabilities.typescript-crap.choices]
exclude = []

# typescript-mutation runs StrykerJS on the lines that a push or the gate's
# range changes. It runs its own tests, apart from the coverage run.
[capabilities.typescript-mutation.tools.stryker]
pin = "10.1.1"
reviewed = ["10.1.1"]

# The runners of both test tools, the Vitest that the Vitest runner starts,
# and a TypeScript with a JavaScript API, which StrykerJS needs.
[capabilities.typescript-mutation.tools.stryker.packages]
"@stryker-mutator/jest-runner" = "10.1.1"
"@stryker-mutator/vitest-runner" = "10.1.1"
typescript = "6.0.3"
vitest = "5.1.1"
